server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true

# If you have spring-cloud-starter-gateway on classpath, these route entries will work.
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

        - id: notification-service
          uri: http://notification-service:8082
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
