version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: simply_postgres
    environment:
      POSTGRES_USER: simply
      POSTGRES_PASSWORD: simply
      POSTGRES_DB: simply_notify
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simply"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simply-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: simply_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simply-network

  redis:
    image: redis:7
    container_name: simply_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simply-network

  user-service:
    build:
      context: ./user-service
    container_name: simply_user
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simply_notify
      SPRING_DATASOURCE_USERNAME: simply
      SPRING_DATASOURCE_PASSWORD: simply
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8081"
    networks:
      - simply-network

  notification-service:
    build:
      context: ./notification-service
    container_name: simply_notification
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simply_notify
      SPRING_DATASOURCE_USERNAME: simply
      SPRING_DATASOURCE_PASSWORD: simply
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8082:8082"
    networks:
      - simply-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: simply_gateway
    depends_on:
      user-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      - simply-network

volumes:
  postgres_data:

networks:
  simply-network:
    driver: bridge

